<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoorAlden • PS4 Web Loader</title>
<style>
:root{
  --cyan:#20e8ff;
  --blue:#3f7cff;
  --violet:#9d5cff;
  --text:#f4fbff;
  --muted:#a9c4d8;
  --panel:rgba(4,10,22,.58);
  --line:rgba(117,226,255,.24);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020812;color:var(--text);
  font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow-x:hidden}
body{
  background:
    linear-gradient(180deg,rgba(0,7,20,.25),rgba(0,5,16,.78)),
    url("custom_background.jpg") center/cover fixed no-repeat;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(rgba(32,232,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(32,232,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),transparent 92%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(transparent 0%,rgba(32,232,255,.025) 50%,transparent 100%);
  background-size:100% 8px;
  opacity:.55;
}
#brand{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:13px 20px;background:rgba(2,7,18,.62);
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);
  box-shadow:0 8px 30px rgba(0,0,0,.28);
}
.brand-left{display:flex;align-items:center;gap:12px}
#brand img{width:44px;height:44px;object-fit:cover;border-radius:13px;
  border:1px solid rgba(100,225,255,.45);
  box-shadow:0 0 20px rgba(32,232,255,.25)}
#brand b{font-size:18px;font-weight:900;letter-spacing:.14em}
#brand span{font-size:11px;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}
#wrap{
  position:relative;z-index:1;width:min(760px,calc(100% - 28px));
  margin:9vh auto 0;padding:34px 26px;text-align:center;
  background:linear-gradient(145deg,rgba(6,16,34,.72),rgba(4,8,20,.48));
  border:1px solid rgba(71,221,255,.28);border-radius:26px;
  box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 50px rgba(32,130,255,.13);
  backdrop-filter:blur(16px);
}
#wrap::before,#wrap::after{content:"";position:absolute;width:54px;height:54px;pointer-events:none}
#wrap::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);border-radius:25px 0 0 0}
#wrap::after{right:-1px;bottom:-1px;border-right:2px solid var(--violet);border-bottom:2px solid var(--violet);border-radius:0 0 25px 0}
#loaderLogo{
  display:block;width:128px;height:128px;object-fit:cover;margin:0 auto 18px;
  border-radius:26px;border:1px solid rgba(130,238,255,.5);
  box-shadow:0 0 0 7px rgba(32,232,255,.045),0 0 40px rgba(32,232,255,.3);
}
#state{font-size:25px;font-weight:900;margin:0 0 7px;text-shadow:0 0 18px rgba(32,232,255,.25)}
#det{font-size:14px;color:var(--muted);margin:0 0 13px}
#det b{color:var(--text)}
#cache{
  display:inline-block;min-height:18px;padding:7px 13px;border:1px solid rgba(120,200,255,.18);
  border-radius:999px;background:rgba(0,12,28,.45);font-size:12px;color:#bdd4e3;
}
#cache.cacheok{color:#7df5d2;border-color:rgba(125,245,210,.28);box-shadow:0 0 18px rgba(125,245,210,.08)}
.ok{color:#7df5d2}.bad{color:#ff8d9b}.warn{color:#ffe27a}
@media(max-width:600px){
  #brand{padding:11px 14px}#brand span{display:none}
  #wrap{margin-top:7vh;padding:28px 17px;width:calc(100% - 20px)}
  #loaderLogo{width:98px;height:98px}
  #state{font-size:21px}
}
</style>
</head>
<body>
<div id="brand">
  <div class="brand-left">
    <img src="logo_raw.png" alt="" width="44" height="44">
    <b>NoorAlden</b>
  </div>
  <span>PS4 • WEB LOADER</span>
</div>
<div id="wrap">
  <img id="loaderLogo" src="logo_raw.png" alt="NoorAlden">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>" : " &middot; not in this build's kernel table");
    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }
    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }
    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true); go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true); go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading", function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () { setCache("cached -- offline ready", true); go(); }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
